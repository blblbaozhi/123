<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="description" content="一个优雅的动态便签墙应用，支持拖拽、全屏、最小化，移动端自适应。" />
		<title>Heart Notes</title>
		<link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
		<link rel="stylesheet" href="src/css/styles.css" />
	</head>
	<body>
		<button class="fullscreen-toggle" id="fullscreenToggle" type="button" aria-label="切换全屏">
			<span class="fullscreen-toggle-icon">⛶</span>
		</button>

		<!-- 引导页 -->
		<div id="welcomePage" class="welcome-page">
			<!-- 引导页的主题切换按钮 -->
			<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
				<span class="theme-toggle-icon">🌙</span>
			</button>
			<div class="welcome-content">
				<h1 class="welcome-title">大哥牛逼！</h1>
				<div class="welcome-enter" id="startButton">
					<span class="enter-text">插入大哥</span>
					<span class="enter-arrow">→</span>
				</div>
			</div>
			<!-- 加载状态 -->
			<div class="loading-overlay" id="loadingOverlay">
				<div class="loading-spinner">
					<span class="loading-dot"></span>
				</div>
				<p class="loading-text" id="loadingText">大哥正在准备...</p>
			</div>
		</div>

		<!-- 主应用界面 -->
		<div id="mainApp" class="main-app" style="display: none;">
			<!-- 卡片页面的音乐控制按钮 -->
			<button class="music-toggle" id="musicToggle" type="button" aria-label="音乐控制">
				<span class="music-toggle-icon">🎵</span>
			</button>
			<div id="board" role="region" aria-label="便签板"></div>
		</div>
		<noscript>需要启用 JavaScript 才能使用便签墙。</noscript>
		<script type="module" src="src/js/app.js"></script>
	</body>
</html>
